<section class="py-5 bg-productos min-vh-100">
  <div class="container py-4">
    <div class="text-center mb-4">
      <h1 class="display-4 fw-bold text-white text-uppercase mb-2">
        Nuestras <span class="text-naranja">Especialidades</span>
      </h1>
      <p class="text-secondary-custom fs-5">Catálogo sincronizado en tiempo real con el panel administrativo.</p>
    </div>

    <!-- Filtros por categoría -->
    <div class="d-flex flex-wrap justify-content-center gap-2 mb-5">
      <button
        *ngFor="let cat of categorias"
        (click)="categoriaSeleccionada = cat"
        class="btn rounded-pill px-4 fw-bold"
        [ngClass]="categoriaSeleccionada === cat ? 'btn-orange text-white' : 'btn-outline-secondary text-light'"
      >
        {{ cat }}
      </button>
    </div>

    <!-- Indicador de carga -->
    <div *ngIf="cargando" class="text-center py-5 text-white">
      <div class="spinner-border text-naranja"></div>
      <p class="mt-2">Cargando menú...</p>
    </div>

    <!-- Cuadrícula dinámica de productos -->
    <div *ngIf="!cargando" class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let prod of productosVisibles">
        <div class="card card-producto bg-dark-card text-white border-0 rounded-4 shadow-sm h-100 overflow-hidden">
          <div class="img-box">
            <img [src]="prod.image" class="card-img-top object-fit-cover h-100" [alt]="prod.title" />
          </div>
          <div class="card-body p-3 d-flex flex-column justify-content-between">
            <div>
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="fw-bold mb-0">{{ prod.title }}</h5>
                <span class="text-naranja fw-bold fs-5">${{ prod.price }}</span>
              </div>
              <p class="text-secondary-custom extra-small mb-3">{{ prod.description }}</p>
            </div>
            <div class="d-flex justify-content-between align-items-center pt-2 border-top border-secondary border-opacity-25">
              <span class="badge bg-dark border border-secondary">{{ prod.category }}</span>
              <a
                [href]="'https://wa.me/522711707459?text=Hola,%20quiero%20ordenar:%20' + prod.title"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-sm btn-orange rounded-pill px-3 fw-bold"
              >
                <i class="bi bi-whatsapp me-1"></i> Pedir
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Mensaje si no hay productos en esa categoría -->
      <div *ngIf="productosVisibles.length === 0" class="col-12 text-center py-5 text-secondary-custom">
        <i class="bi bi-inbox fs-1 d-block mb-2 text-naranja"></i>
        <p class="mb-0">No hay platillos registrados en esta categoría todavía.</p>
      </div>
    </div>
  </div>
</section>
